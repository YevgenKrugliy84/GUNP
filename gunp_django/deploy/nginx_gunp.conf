server {
    listen 8095;
    server_name 10.111.16.6;

    client_max_body_size 20M;

    location /static/ {
        alias "/home/poweredge/projects/чат фінал майже/чат фінал майже/GUNP/gunp_django/staticfiles/";
    }

    location /media/ {
        alias "/home/poweredge/projects/чат фінал майже/чат фінал майже/GUNP/gunp_django/media/";
    }

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
